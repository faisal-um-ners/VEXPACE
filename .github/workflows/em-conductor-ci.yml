name: EM conductor modes and regression tests

on:
  pull_request:
  push:
    branches:
      - feature/em-conductor-modes-20261111

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest PySide6
      - name: Compile changed modules
        run: |
          python -m py_compile picstudio/core/simulation.py picstudio/model/schema.py picstudio/model/model.py tests/test_em_conductor_modes.py
      - name: Run EM mode tests
        run: python -m pytest -q tests/test_em_conductor_modes.py
      - name: Run existing regression suite
        run: python -m pytest -q tests
